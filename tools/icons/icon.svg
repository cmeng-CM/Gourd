    <path d="M 268 852 Q 340 836 412 852 T 556 852 T 700 852 T 844 852" fill="none" stroke="#9DB0FF" stroke-width="6" opacity="0.4"/>
    <path d="M 268 876 Q 340 860 412 876 T 556 876 T 700 876 T 844 876" fill="none" stroke="#9DB0FF" stroke-width="6" opacity="0.28"/>
  </g>

  <!-- 葫芦描边与藤蒂 -->
  <path d="M 512 292 C 590 292 664 348 664 432 C 664 480 636 512 596 534 C 660 566 740 620 740 712 C 740 812 640 888 512 888 C 384 888 284 812 284 712 C 284 620 364 566 428 534 C 388 512 360 480 360 432 C 360 348 434 292 512 292 Z"
        fill="none" stroke="#E9C879" stroke-width="7"/>
  <path d="M 512 292 C 512 254 532 234 566 226" fill="none" stroke="#E9C879" stroke-width="10" stroke-linecap="round"/>
</svg>
